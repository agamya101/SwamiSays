<!DOCTYPE html>
<html lang="en" data-theme="kesari">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwamiSays — Vivekananda for Gen Z / Alpha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=DM+Serif+Display:ital@0;1&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Immediate theme resolution to prevent flash of unstyled theme
      (function() {
        try {
          const params = new URLSearchParams(window.location.search);
          const urlTheme = params.get('theme');
          const savedTheme = localStorage.getItem('theme');
          let theme = urlTheme || savedTheme;
          if (!theme) {
            theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'clay' : 'kesari';
          }
          if (['kesari', 'clay', 'indigo'].includes(theme)) {
            document.documentElement.setAttribute('data-theme', theme);
          }
          if (params.get('embed') === '1') {
            document.documentElement.classList.add('is-embed');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
